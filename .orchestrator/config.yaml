version: 1

agents:
  codex:
    kind: codex

roles:
  worker:
    agent: codex
    skill: implement

workflow:
  workerTimeoutSeconds: 1800
  maxWorkerAttempts: 2
  validation:
    test: "pnpm test"
    lint: "pnpm lint"
    typecheck: "pnpm typecheck"
    formatCheck: "pnpm format:check"
    build: "pnpm build"
    timeoutSeconds: 900
